# More information under https://docs.ionos.space/docs/github-actions-customization/

name: "Deploy Now: Execute Build"

on:
  - push
  - workflow_dispatch

jobs:
  project:
    runs-on: ubuntu-latest
    outputs:
      site-url: ${{ steps.project.outputs.site-url }}
      branch-id: ${{ steps.project.outputs.branch-id }}
      deployment-ids: ${{ steps.project.outputs.deployment-ids }}
    steps:
      - name: Fetch project data
        uses: ionos-deploy-now/retrieve-project-info-action@v1
        id: project
        with:
          api-key: ${{ secrets.IONOS_API_KEY }}
          service-host: api-us.ionos.space
          project: cb6d8518-0c75-494c-ae6d-c6e1a494f7dc

  build:
    needs: project
    uses: ./.github/workflows/Woodside-Deli-Website-build.yaml
    with:
      site-url: ${{ needs.project.outputs.site-url }}
      branch-id: ${{ needs.project.outputs.branch-id }}
    secrets: inherit

  validate-deploy-config:
    needs: project
    runs-on: ubuntu-latest
    steps:
      - name: Validate IONOS deployment targets
        run: |
          echo "branch-id: '${{ needs.project.outputs.branch-id }}'"
          echo "deployment-ids: '${{ needs.project.outputs.deployment-ids }}'"
          if [ -z "${{ needs.project.outputs.branch-id }}" ]; then
            echo "ERROR: IONOS did not return a branch-id for this GitHub branch."
            echo "Fix: In IONOS Deploy Now, connect this repository branch as a deployment branch (or reconnect GitHub integration)."
            exit 1
          fi
          if [ -z "${{ needs.project.outputs.deployment-ids }}" ] || [ "${{ needs.project.outputs.deployment-ids }}" = "[]" ]; then
            echo "ERROR: IONOS returned no deployment targets for this branch (deployment-ids empty)."
            echo "Fix: In IONOS Deploy Now, create/enable a deployment target for this branch (usually 'main')."
            exit 1
          fi

  deploy:
    needs: [project, build, validate-deploy-config]
    permissions:
      actions: read
    uses: ./.github/workflows/deploy-to-ionos.yaml
    with:
      version: ${{ github.sha }}
      project-id: cb6d8518-0c75-494c-ae6d-c6e1a494f7dc
      branch-id: ${{ needs.project.outputs.branch-id }}
      deployment-ids: ${{ needs.project.outputs.deployment-ids }}
    secrets: inherit
